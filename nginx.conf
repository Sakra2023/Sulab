# ─── HTTP: redirige a HTTPS (y sirve ACME challenge) ───
server {
    listen 80;
    listen [::]:80;
    server_name sulabb.com www.sulabb.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ───
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sulabb.com www.sulabb.com;

    ssl_certificate     /etc/letsencrypt/live/sulabb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sulabb.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /facturas_pdf/ {
        proxy_pass http://backend:3000/facturas_pdf/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /img-premios/ {
        proxy_pass http://backend:3000/img-premios/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /img-emprendimientos/ {
        proxy_pass http://backend:3000/img-emprendimientos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /img-usuarios/ {
        proxy_pass http://backend:3000/img-usuarios/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}