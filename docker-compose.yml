name: sulab

services:
  mysql:
    image: mysql:8
    container_name: sulab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sakra2023
      MYSQL_DATABASE: lap
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psakra2023"]
      timeout: 10s
      retries: 10
      interval: 5s
      start_period: 30s
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sulab-backend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=sakra2023
      - DB_NAME=lap
      - JWT_SECRET=gatO-volador-123-cafe-XyZ!-R2D2
      - FRONTEND_URL=https://www.sulabb.com
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./server/facturas_pdf:/app/server/facturas_pdf
      - ./server/img-emprendimientos:/app/server/img-emprendimientos
      - ./server/img-premios:/app/server/img-premios
      - ./server/img-usuarios:/app/server/img-usuarios
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sulab-frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: sulab-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge