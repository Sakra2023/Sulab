server {
    listen 80;
    listen [::]:80;
    server_name sulabb.com www.sulabb.com;

    client_max_body_size 20M;

    # ✅ GZIP compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ✅ Frontend (React build servido por sulab-frontend en el puerto 80)
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ✅ API
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # ✅ WebSocket
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ✅ Archivos estáticos del backend
    location /facturas_pdf/ {
        proxy_pass http://backend:3000/facturas_pdf/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /img-premios/ {
        proxy_pass http://backend:3000/img-premios/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /img-emprendimientos/ {
        proxy_pass http://backend:3000/img-emprendimientos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /img-usuarios/ {
        proxy_pass http://backend:3000/img-usuarios/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}