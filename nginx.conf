server {
    listen 80;
    server_name sulabb.com www.sulabb.com localhost 192.168.100.13;
    #server_name localhost 192.168.100.13;
    client_max_body_size 20M;
    
    root /usr/share/nginx/html;
    index index.html;

    # ✅ GZIP compresión para mejor rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ✅ Cache para archivos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ✅ React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ✅ API
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # ✅ WebSocket
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ✅ Archivos estáticos del backend
    location /facturas_pdf/ {
        proxy_pass http://backend:3000/facturas_pdf/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /img-premios/ {
        proxy_pass http://backend:3000/img-premios/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /img-emprendimientos/ {
        proxy_pass http://backend:3000/img-emprendimientos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /img-usuarios/ {
        proxy_pass http://backend:3000/img-usuarios/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}